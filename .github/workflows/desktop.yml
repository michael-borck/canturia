# Canturía desktop release: thin caller for the app-hq shared Tauri pipeline.
#
# Push a tag like v0.3.1 to build, sign, notarize, and publish the installers.
# Manual dispatch runs the notarization check only.
name: Release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: michael-borck/app-hq/.github/workflows/tauri-release.yml@main
    with:
      product-name: Canturía
      project-path: desktop
      tauri-script: npx tauri
      install-command: npm ci --prefix desktop
      cache: ""
      preflight-command: ""
      updater: false
      release-body: |
        Canturía — words into a song, rendered by your own ACE-Step server.

        Choose a lyricist (Ollama, OpenAI-compatible BYOK, or ACE-Step LM),
        preview and edit the lyrics, then sing with an exact duration. No
        account, no telemetry.

        macOS builds are signed and notarized. Windows and Linux builds are
        unsigned; first launch downloads a private Python runtime (~1 min).
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  stable-assets:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" \
            -R "$GITHUB_REPOSITORY" -D release-assets

      - name: Add stable asset aliases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          copy_first() {
            local pattern="$1" dest="$2"
            local files=( $pattern )
            if [ ${#files[@]} -gt 0 ]; then
              cp "${files[0]}" "$dest"
              echo "alias $dest"
            else
              echo "missing pattern $pattern"
            fi
          }
          copy_first "*_aarch64.dmg" "Canturia-macOS-Apple-Silicon.dmg"
          copy_first "*_x64.dmg" "Canturia-macOS-Intel.dmg"
          copy_first "*_x64-setup.exe" "Canturia-Windows-x64-Setup.exe"
          copy_first "*_x64_en-US.msi" "Canturia-Windows-x64.msi"
          copy_first "*_amd64.AppImage" "Canturia-Linux-x86_64.AppImage"
          copy_first "*_amd64.deb" "Canturia-Linux-amd64.deb"
          copy_first "*_x86_64.rpm" "Canturia-Linux-x86_64.rpm"
          gh release upload "$GITHUB_REF_NAME" Canturia-* \
            --clobber -R "$GITHUB_REPOSITORY"
