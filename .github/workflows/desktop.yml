# Build Canturía desktop installers for macOS / Windows / Linux.
#
# Trigger: push a tag like desktop-v0.1.0 (creates a GitHub release with the
# installers attached), or run manually from the Actions tab (artifacts only).
#
# Builds are unsigned until signing secrets are configured. macOS Gatekeeper
# and Windows SmartScreen will ask the user to allow the first launch.
name: desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            target: ""
          - platform: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'Canturía Desktop __VERSION__' || '' }}
          releaseDraft: false
          releaseBody: |
            Canturía desktop — words into a song, with your own ACE-Step server.

            First launch downloads a private Python runtime (~1 min), then
            configure your server URL in Settings. Lyrics mode works on a lean
            server; Describe mode needs its lyrics writer enabled.

            Builds are unsigned: macOS may ask you to allow the app in
            Privacy & Security; Windows uses "More info > Run anyway".
          args: ${{ matrix.args }}

      - name: Upload artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: canturia-desktop-${{ matrix.platform }}${{ matrix.target && '-' }}${{ matrix.target }}
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            desktop/src-tauri/target/**/release/bundle/**/*.deb
            desktop/src-tauri/target/**/release/bundle/**/*.rpm
            desktop/src-tauri/target/**/release/bundle/**/*.msi
            desktop/src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: warn
          retention-days: 5
