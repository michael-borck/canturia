[package]
name = "canturia-desktop"
version = "0.3.3"
description = "Canturía — words into a song, on your desktop"
authors = ["Michael Borck <michael.borck@curtin.edu.au>"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
strip = true
lto = true
