<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canturía</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1f24; --muted: #6b7280;
    --line: #e3e1dc; --accent: #b85c38; --accent-soft: #f3e3da;
    --accent-ink: #ffffff; --danger: #c2452d; --ok: #2c7a4b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --panel: #181b21; --ink: #e8e6e1; --muted: #8b93a1;
      --line: #262a32; --accent: #e08a5f; --accent-soft: #2a1c16;
      --accent-ink: #1b1210; --danger: #e06c50; --ok: #5fbf85;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  header { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.5rem; }
  header .brand { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: .01em; }
  header small { color: var(--muted); }
  .spacer { margin-left: auto; }
  .pill {
    font: inherit; font-size: .78rem; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: .25rem .65rem; cursor: pointer;
  }
  .pill:hover { border-color: var(--muted); }
  .pill.good { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
  .pill.bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
  .prompt-box {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 1rem;
  }
  .tabs {
    display: inline-flex; gap: .2rem; padding: .2rem;
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
    margin-bottom: .7rem;
  }
  .tab {
    font: inherit; font-size: .86rem; color: var(--muted);
    background: transparent; border: 0; border-radius: 7px;
    padding: .3rem .8rem; cursor: pointer;
  }
  .tab.active { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  textarea {
    width: 100%; min-height: 8rem; resize: vertical; border: none;
    background: transparent; color: var(--ink); font: inherit; outline: none;
  }
  textarea.describe { min-height: 4.5rem; }
  .tags {
    display: flex; align-items: center; gap: .35rem; flex-wrap: wrap;
    padding-top: .4rem; color: var(--muted); font-size: .78rem;
  }
  .tags button {
    font: inherit; font-size: .75rem; padding: .15rem .5rem;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--bg); color: var(--muted); cursor: pointer;
  }
  .tags button:hover { color: var(--ink); border-color: var(--muted); }
  .controls {
    display: grid; gap: .8rem; padding: .9rem 0 .2rem;
    border-top: 1px solid var(--line); margin-top: .7rem;
  }
  .control { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .control > label { font-size: .78rem; color: var(--muted); width: 4.2rem; }
  .chips { display: flex; gap: .35rem; flex-wrap: wrap; }
  .chip {
    font: inherit; font-size: .78rem; color: var(--muted);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 999px; padding: .22rem .65rem; cursor: pointer;
  }
  .chip:hover { color: var(--ink); border-color: var(--muted); }
  .chip.active { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
  .length input {
    font: inherit; font-size: .86rem; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 7px; padding: .25rem .45rem; width: 5rem;
  }
  .style-row { display: flex; align-items: center; gap: .6rem; }
  .style-row input {
    flex: 1; font: inherit; font-size: .86rem; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 7px; padding: .35rem .55rem;
  }
  .bar { display: flex; align-items: center; gap: .75rem; margin-top: .8rem; flex-wrap: wrap; }
  button { font: inherit; }
  .primary {
    background: var(--accent); color: var(--accent-ink);
    border: 1px solid transparent; border-radius: 8px;
    font-weight: 600; padding: .45rem 1.4rem; cursor: pointer;
  }
  .primary:disabled { opacity: .55; cursor: wait; }
  .hint { color: var(--muted); font-size: .8rem; margin-left: auto; }
  .notice {
    display: none; margin: 1rem 0 0; padding: .55rem .9rem; border-radius: 8px;
    font-size: .86rem; background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .notice a { color: var(--accent); }
  #error {
    display: none; margin: 1rem 0 0; padding: .6rem .9rem; border-radius: 8px;
    background: color-mix(in srgb, var(--danger) 12%, transparent);
    border: 1px solid var(--danger); color: var(--danger); font-size: .9rem;
    white-space: pre-wrap;
  }
  #gallery {
    margin-top: 2rem; display: grid; gap: 1rem;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
  }
  .card .body { padding: .75rem .8rem .8rem; display: flex; flex-direction: column; gap: .5rem; }
  .card .title { font-size: .9rem; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
  .card .meta { font-size: .72rem; color: var(--muted); }
  .card audio { width: 100%; height: 36px; accent-color: var(--accent); }
  .card .row { display: flex; gap: .4rem; flex-wrap: wrap; }
  .card .row button {
    font-size: .76rem; padding: .3rem .55rem; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    cursor: pointer; flex: 1;
  }
  .card .row button:hover { border-color: var(--muted); }
  .card .saved { color: var(--ok); font-size: .72rem; overflow-wrap: anywhere; }
  .empty { color: var(--muted); margin-top: 2.5rem; text-align: center; }
  @keyframes pulse { 50% { opacity: .45; } }
  .card.pending .ph {
    height: 58px; background: var(--line); animation: pulse 1.2s ease-in-out infinite;
    border-radius: 6px; margin-bottom: .55rem;
  }
  .card.pending .progress { font-size: .78rem; color: var(--muted); }
  .lock {
    font: inherit; font-size: .78rem; color: var(--muted); background: transparent;
    border: 0; cursor: pointer; text-decoration: underline;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Canturía</h1>
      <small>words into a song — yours, locally</small>
    </div>
    <span class="spacer"></span>
    <button class="pill" id="server-pill" type="button" title="Check the ACE-Step server">checking…</button>
    <button class="lock" id="lock" type="button" style="display:none">Lock</button>
  </header>

  <div class="prompt-box">
    <div class="tabs" role="tablist" aria-label="Input mode">
      <button class="tab active" type="button" data-mode="lyrics" role="tab" aria-selected="true">Lyrics</button>
      <button class="tab" type="button" data-mode="describe" role="tab" aria-selected="false">Describe</button>
    </div>
    <textarea id="text" autofocus
      placeholder="[Verse]&#10;Morning light across the floor&#10;[Chorus]&#10;Grow a little every day"></textarea>
    <div class="tags" id="tag-row">
      <span>Insert</span>
      <button type="button" data-tag="[Verse]">Verse</button>
      <button type="button" data-tag="[Chorus]">Chorus</button>
      <button type="button" data-tag="[Bridge]">Bridge</button>
      <button type="button" data-tag="[Outro]">Outro</button>
    </div>

    <div class="controls">
      <div class="control">
        <label>Genre</label>
        <div class="chips" id="genres"></div>
      </div>
      <div class="control length">
        <label>Length</label>
        <div class="chips" id="durations"></div>
        <input id="duration" type="number" min="10" max="600" step="1" value="30"
               aria-label="Length in seconds">
        <span style="font-size:.8rem;color:var(--muted)">seconds</span>
      </div>
      <div class="control">
        <label>Style</label>
        <div class="style-row">
          <input id="style" placeholder="warm female vocals, fingerpicked guitar, close mic…">
        </div>
      </div>
    </div>

    <div class="bar">
      <button class="primary" id="go" type="button">Generate</button>
      <span class="hint">⌘⏎ / Ctrl⏎ to generate</span>
    </div>
  </div>

  <div class="notice" id="notice"></div>
  <div id="error"></div>
  <div id="gallery"></div>
  <p class="empty" id="empty">Nothing yet. Songs appear here — kept in memory until you save them.</p>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const gallery = $("gallery"), empty = $("empty"), errBox = $("error");
const text = $("text"), go = $("go"), notice = $("notice");
const durationInput = $("duration"), styleInput = $("style");
const pill = $("server-pill"), lock = $("lock");

const state = {
  mode: "lyrics",
  genre: "folk",
  duration: 30,
  config: null,
  health: null,
  llm: null,
  checked: false,
  busy: false,
};

async function api(path, options = {}) {
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  const response = await fetch(path, { ...options, headers });
  if (response.status === 401) {
    window.location.reload();
    throw new Error("Password required");
  }
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return response.json();
}

function showError(message) {
  errBox.textContent = message;
  errBox.style.display = "block";
}
function clearError() { errBox.style.display = "none"; }

function showNotice(message) {
  if (!message) { notice.style.display = "none"; notice.textContent = ""; return; }
  notice.textContent = message;
  notice.style.display = "block";
}

function updateEmpty() {
  empty.style.display = gallery.children.length ? "none" : "";
}

function labelForGenre(key) {
  const found = (state.config?.genres || []).find((g) => g.key === key);
  if (found) return found.label;
  return key ? key.charAt(0).toUpperCase() + key.slice(1) : "Song";
}

function formatDuration(seconds) {
  const total = Math.round(Number(seconds) || 0);
  if (total < 60) return `${total}s`;
  const minutes = Math.floor(total / 60);
  const rest = String(total % 60).padStart(2, "0");
  return `${minutes}:${rest}`;
}

function firstLine(value) {
  const line = (value || "").split("\n").map((s) => s.trim())
    .find((s) => s && !/^\[[^\]]+\]$/.test(s));
  return line || "Untitled song";
}

function updateNotice() {
  if (state.mode === "describe" && state.llm === false) {
    showNotice("The server's lyrics writer is off, so Describe cannot write lyrics. Use Lyrics, or set resident: true in puente.yml and recheck.");
    return;
  }
  if (state.checked && state.health === null) {
    showNotice("ACE-Step is not reachable. Check the URL and that the service is running, then recheck.");
    return;
  }
  showNotice("");
}

function updateGoState() {
  const blocked = state.mode === "describe" && state.llm === false;
  go.disabled = state.busy || blocked;
  go.textContent = state.busy ? "Composing…" : "Generate";
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll(".tab").forEach((tab) => {
    const active = tab.dataset.mode === mode;
    tab.classList.toggle("active", active);
    tab.setAttribute("aria-selected", active ? "true" : "false");
  });
  $("tag-row").style.display = mode === "lyrics" ? "" : "none";
  text.classList.toggle("describe", mode === "describe");
  text.placeholder = mode === "lyrics"
    ? "[Verse]\nMorning light across the floor\n[Chorus]\nGrow a little every day"
    : "a warm folk song about growing up by the sea…";
  updateNotice();
  updateGoState();
}

function renderGenres(genres) {
  const box = $("genres");
  box.textContent = "";
  for (const genre of genres) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "chip";
    button.textContent = genre.label;
    button.dataset.genre = genre.key;
    button.onclick = () => {
      state.genre = genre.key;
      for (const chip of box.children) {
        chip.classList.toggle("active", chip.dataset.genre === genre.key);
      }
    };
    if (genre.key === state.genre) button.classList.add("active");
    box.appendChild(button);
  }
}

function setDuration(seconds) {
  const value = Math.max(10, Math.min(600, Number(seconds) || 30));
  state.duration = value;
  durationInput.value = value;
  for (const chip of $("durations").children) {
    chip.classList.toggle("active", Number(chip.dataset.duration) === value);
  }
}

function renderDurations(values) {
  const box = $("durations");
  box.textContent = "";
  for (const value of values) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "chip";
    button.textContent = `${value}s`;
    button.dataset.duration = String(value);
    button.onclick = () => setDuration(value);
    box.appendChild(button);
  }
  setDuration(state.duration);
}

async function checkHealth() {
  pill.textContent = "checking…";
  pill.className = "pill";
  try {
    const health = await api("/api/health");
    state.health = health;
    state.llm = Boolean(health.llm_initialized);
    const model = health.loaded_model || "ACE-Step";
    pill.textContent = `${model} · lyrics writer ${state.llm ? "on" : "off"}`;
    pill.className = state.llm ? "pill good" : "pill";
  } catch (err) {
    state.health = null;
    state.llm = null;
    pill.textContent = "ACE-Step offline";
    pill.className = "pill bad";
  }
  state.checked = true;
  updateNotice();
  updateGoState();
}

function addPending(label = "Generating…") {
  const card = document.createElement("div");
  card.className = "card pending";
  card.innerHTML = '<div class="ph"></div><div class="progress"></div>';
  card.querySelector(".progress").textContent = label;
  gallery.prepend(card);
  updateEmpty();
  return card;
}

function setProgress(card, message) {
  const line = card?.querySelector(".progress");
  if (line && message) line.textContent = message;
}

function addCard(song) {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.id = song.id;

  const body = document.createElement("div");
  body.className = "body";

  const title = document.createElement("div");
  title.className = "title";
  title.textContent = firstLine(song.text);
  title.title = song.text || "";

  const meta = document.createElement("div");
  meta.className = "meta";
  const bits = [labelForGenre(song.genre), formatDuration(song.duration)];
  if (song.metas && song.metas.bpm) bits.push(`${song.metas.bpm} BPM`);
  meta.textContent = bits.join(" · ");

  const audio = document.createElement("audio");
  audio.controls = true;
  audio.preload = "metadata";
  audio.src = `/api/songs/${song.id}`;
  audio.setAttribute("aria-label", title.textContent);

  const row = document.createElement("div");
  row.className = "row";

  const save = document.createElement("button");
  save.type = "button";
  save.textContent = "Save";
  const saved = document.createElement("div");
  saved.className = "saved";
  saved.style.display = "none";
  save.onclick = async () => {
    try {
      const result = await api(`/api/songs/${song.id}/save`, { method: "POST", body: "{}" });
      saved.textContent = "saved → " + result.path;
      saved.style.display = "block";
      save.textContent = "Saved";
    } catch (err) {
      showError("Save failed: " + err.message);
    }
  };

  const download = document.createElement("button");
  download.type = "button";
  download.textContent = "Download";
  download.onclick = () => {
    window.location.href = `/api/songs/${song.id}?download=1`;
  };

  const again = document.createElement("button");
  again.type = "button";
  again.textContent = "Again";
  again.onclick = async () => {
    again.disabled = true;
    const pending = addPending("Generating another take…");
    try {
      const { job_id } = await api(`/api/songs/${song.id}/again`, { method: "POST" });
      const songs = await pollJob(job_id, pending);
      songs.forEach(addCard);
    } catch (err) {
      pending.remove();
      updateEmpty();
      showError(err.message);
    } finally {
      again.disabled = false;
    }
  };

  const del = document.createElement("button");
  del.type = "button";
  del.textContent = "Delete";
  del.onclick = async () => {
    try { await api(`/api/songs/${song.id}`, { method: "DELETE" }); } catch {}
    card.remove();
    updateEmpty();
  };

  row.append(save, download, again, del);
  body.append(title, meta, audio, row, saved);
  card.appendChild(body);
  gallery.prepend(card);
  updateEmpty();
}

async function pollJob(jobId, pending) {
  for (;;) {
    await new Promise((resolve) => setTimeout(resolve, 1500));
    const job = await api(`/api/jobs/${jobId}`);
    setProgress(pending, job.progress || job.status);
    if (job.status === "done") {
      pending.remove();
      updateEmpty();
      return job.songs || [];
    }
    if (job.status === "failed") {
      pending.remove();
      updateEmpty();
      throw new Error(job.error || "Generation failed");
    }
  }
}

async function generate() {
  clearError();
  const source = text.value.trim();
  if (!source) { text.focus(); return; }
  const duration = Number(durationInput.value);
  if (!Number.isFinite(duration) || duration < 10 || duration > 600) {
    showError("Length must be between 10 and 600 seconds.");
    durationInput.focus();
    return;
  }

  state.busy = true;
  updateGoState();
  const pending = addPending("Queued…");
  try {
    const payload = {
      mode: state.mode,
      text: source,
      genre: state.genre || "folk",
      style: styleInput.value.trim(),
      duration,
    };
    const { job_id } = await api("/api/generate", {
      method: "POST",
      body: JSON.stringify(payload),
    });
    const songs = await pollJob(job_id, pending);
    songs.forEach(addCard);
  } catch (err) {
    pending.remove();
    updateEmpty();
    showError(err.message);
  } finally {
    state.busy = false;
    updateGoState();
  }
}

async function boot() {
  document.querySelectorAll(".tab").forEach((tab) => {
    tab.onclick = () => setMode(tab.dataset.mode);
  });
  $("tag-row").querySelectorAll("button").forEach((button) => {
    button.onclick = () => {
      const tag = `\n${button.dataset.tag}\n`;
      const start = text.selectionStart ?? text.value.length;
      const end = text.selectionEnd ?? start;
      text.setRangeText(tag, start, end, "end");
      text.focus();
    };
  });
  durationInput.oninput = () => setDuration(durationInput.value);
  go.onclick = generate;
  pill.onclick = checkHealth;
  text.addEventListener("keydown", (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
      event.preventDefault();
      generate();
    }
  });

  try {
    const config = await api("/api/config");
    state.config = config;
    state.genre = config.genre || "folk";
    state.duration = Number(config.duration) || 30;
    if (config.style) styleInput.value = config.style;
    renderGenres(config.genres || []);
    renderDurations(config.durations || [30, 60, 90, 120]);
    if (config.auth) lock.style.display = "";
  } catch (err) {
    showError(err.message);
  }

  lock.onclick = async () => {
    try { await api("/api/logout", { method: "POST" }); } catch {}
    window.location.reload();
  };

  setMode("lyrics");
  updateEmpty();
  checkHealth();
}

boot();
</script>
</body>
</html>
